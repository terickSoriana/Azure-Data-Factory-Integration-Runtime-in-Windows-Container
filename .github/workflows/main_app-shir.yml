name: Build and deploy SHIR to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry crfeniciadev \
            --image shir:${{ github.sha }} \
            --platform Windows/amd64 \
            .

      - name: Deploy container to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: app-shir
          slot-name: Production
          images: crfeniciadev.azurecr.io/shir:${{ github.sha }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_38C13AD5D35A491DAD501CC482591CB7 }}
