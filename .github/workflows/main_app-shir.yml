name: Build and deploy container app to Azure Web App - app-shir

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Start Docker
        shell: powershell
        run: |
          Start-Service -Name Docker
          (Get-Service -Name Docker).WaitForStatus('Running', '00:01:00')
          docker ps

      - name: Verify Docker
        shell: powershell
        run: |
          docker version
          docker info

      - name: Docker login to container registry
        uses: docker/login-action@v3
        with:
          registry: crfeniciadev.azurecr.io
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_C0CA0E296C9A45CB8323DCB48FE42A6D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_EE97D31A489844FDBE998481D99F812B }}

      - name: Build container
        shell: powershell
        run: |
          docker build --isolation=hyperv -t crfeniciadev.azurecr.io/shir:${{ github.sha }} .

      - name: Push container
        shell: powershell
        run: |
          docker push crfeniciadev.azurecr.io/shir:${{ github.sha }}

      - name: Deploy container to Azure App Service
        uses: Azure/webapps-deploy@v2
        with:
          app-name: app-shir
          slot-name: Production
          images: crfeniciadev.azurecr.io/shir:${{ github.sha }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_38C13AD5D35A491DAD501CC482591CB7 }}
